<svg xmlns="http://www.w3.org/2000/svg" width="710" height="330" viewBox="0 0 710 330" style="max-width: 100%; height: auto" role="img" aria-labelledby="edit-loop-timeline-title edit-loop-timeline-desc" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13">
  <title id="edit-loop-timeline-title">Build timelines after editing a nexus-db-queries method</title>
  <desc id="edit-loop-timeline-desc">Without preinstantiate, nexus-db-queries builds from 0.6s to 4.1s and omicron-nexus from 4.7s to 33.6s. With code generated in nexus-db-queries, nexus-db-queries builds from 0.8s to 12.6s and omicron-nexus from 10.8s to 22.1s. With shard crates, nexus-db-queries builds from 0.6s to 4.5s, the shards from 3.4s to 7.9s, and omicron-nexus from 5.3s to 12.7s.</desc>
