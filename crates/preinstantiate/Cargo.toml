[package]
name = "preinstantiate"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish = false
readme = "README.md"

[lints]
workspace = true

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg=doc_cfg"]

[features]
build = ["dep:atomicwrites", "dep:camino", "dep:proc-macro2", "dep:syn"]
doc-diagrams = ["dep:simple-mermaid"]

[dependencies]
atomicwrites = { workspace = true, optional = true }
camino = { workspace = true, optional = true }
# This enables span-locations to provide better syn errors.
proc-macro2 = { workspace = true, optional = true }
simple-mermaid = { workspace = true, optional = true }
syn = { workspace = true, optional = true }

[dev-dependencies]
camino-tempfile.workspace = true
expectorate.workspace = true
preinstantiate = { workspace = true, features = ["build"] }
